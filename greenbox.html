</h2>

<p>

Premium Apparel • Built Different • Stand Out

</p>

<!-- ================= FOOTER ================= -->

<div class="footer-links">

<div>

</div>

</div>

<script src="../products.js"></script>

<script src="../script.js"></script>

<script>

/*=========================================
        LOAD GREEN BOX PRODUCTS
=========================================*/

const container =
document.getElementById("greenProducts");

let html = "";

products
.filter(product => product.brand === "Green Box Baby")
.forEach(product => {

html += `

<div class="product-card"
data-category="${product.category}">

<button
class="favorite-btn"
data-id="${product.id}"
onclick="toggleFavorite('${product.id}')">

🤍

</button>

<img
src="../${product.image}"
alt="${product.name}">

<h3>

${product.name}

</h3>

<p>

${product.category}

</p>

<p>

S-XL $${product.priceSmall}

<br>

2XL+ $${product.priceLarge}

</p>

<button
class="buy-btn"
onclick="viewProduct('${product.id}')">

Customize & Order

</button>

</div>

`;

});

container.innerHTML = html;

updateFavoriteIcons();

updateCartBadge();

</script>

</body>

</html>

</section>
