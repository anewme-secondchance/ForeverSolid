↑


</button>

<!-- ========================= -->
<!-- SCRIPTS -->
<!-- ========================= -->


<script src="products.js"></script>

<script src="trial.js"></script>

<script src="script.js"></script>



<script>

/*=========================================
        LOAD GREEN BOX PRODUCTS
=========================================*/


const container = document.getElementById("greenProducts");

let html = "";


if(container && typeof products !== "undefined"){


products

.filter(product => product.brand === "Green Box Baby")

.forEach(product => {


html += `

<div class="product-card" data-category="${product.category}">


<img

src="${product.image}"

alt="${product.name}">



<div class="product-info">


<h3>

${product.name}

</h3>



<p>

${product.category}

</p>



<div class="price">


<strong>S–XL:</strong> $${product.priceSmall}

<br>


<strong>2XL+:</strong> $${product.priceLarge}



</div>


<button

class="buy-btn"

onclick="viewProduct('${product.id}')">


Customize & Order


</button>




</div>


</div>


`;


});


container.innerHTML = html;


}


updateCartBadge();


</script>


</body>
