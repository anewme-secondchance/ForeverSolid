</head>

<body>

<!-- ========================= -->

alt="Forever Solid">

</section>

<!-- ========================= -->
<!-- PRODUCT PAGE -->
<!-- ========================= -->

<section class="product-page">

<div class="product-images">

<img

id="productImage"

src=""

alt="Product"

onclick="openFullImage(this)">

</div>

<div class="product-details">

 <h1 id="productName">

Loading...

</h1>

<p id="productDescription">

Premium Streetwear

</p>

<h2>

$<span id="productPrice">

35

</span>

</h2>

<label>

Size

</label>

<select id="size">

<option>S</option>

<option>M</option>

<option>L</option>

<option>XL</option>

<option>2XL</option>

<option>3XL</option>

<option>4XL</option>

</select>

<label>

Color

</label>

<input
type="text"
id="color"
placeholder="Type Desired Color">

<label>

Quantity

</label>

<input
type="number"
id="quantity"
value="1"
min="1">

<label>

Pickup or Shipping

</label>

<div class="delivery-options">

<label>

<input
type="radio"
name="delivery"
value="Pickup"
checked
onclick="toggleShipping()">

Pickup

</label>

<label>

<input
type="radio"
name="delivery"
value="Shipping"
onclick="toggleShipping()">

Shipping

</label>

</div>

<div id="shippingSection" style="display:none;">

<label>

Street Address

</label>

<input
type="text"
id="address"
placeholder="123 Main Street">

<label>

City

</label>

<input
type="text"
id="city"
placeholder="City">

<label>

State

</label>

<input
type="text"
id="state"
placeholder="State">

<label>

Zip Code

</label>

<input
type="text"
id="zip"
placeholder="Zip Code">

</div>

<label>

Special Instructions

</label>

<textarea
id="notes"
rows="4"
placeholder="Anything you'd like us to know?">

</textarea>

<div class="product-buttons">

<button
class="cart-button"
onclick="addToCart()">

🛒 Add To Cart

</button>

<button
class="order-button"
onclick="buyNow()">

⚡ Buy Now

</button>

 <!-- ========================= -->
<!-- SCRIPTS -->
<!-- ========================= -->

<script src="products.js"></script>

<script src="trial.js"></script>

<script src="script.js"></script>

<script>

/*=========================================
        LOAD PRODUCT
=========================================*/

const params = new URLSearchParams(window.location.search);

const productId = params.get("id");

const product = products.find(p => p.id === productId);

if(!product){

    location.href = "shop.html";

}

else{

    document.getElementById("productImage").src =
    product.image;

    document.getElementById("productName").innerHTML =
    product.name;

    document.getElementById("productDescription").innerHTML =
    product.description || "Premium Streetwear";

    document.getElementById("productPrice").innerHTML =
    product.priceSmall;

}

/*=========================================
        UPDATE PRICE
=========================================*/

document.getElementById("size").addEventListener("change",function(){

const size=this.value;

if(size==="2XL" || size==="3XL" || size==="4XL"){

document.getElementById("productPrice").innerHTML =
product.priceLarge;

}else{

document.getElementById("productPrice").innerHTML =
product.priceSmall;

}

});

/*=========================================
        SHIPPING
=========================================*/

function toggleShipping(){

const method=document.querySelector('input[name="delivery"]:checked').value;

document.getElementById("shippingSection").style.display =

method==="Shipping" ? "block" : "none";

}

/*=========================================
        ADD TO CART
=========================================*/

function addToCart(){

const cart=JSON.parse(localStorage.getItem("cart")) || [];

cart.push({

id:product.id,

name:product.name,

image:product.image,

price:document.getElementById("productPrice").innerHTML,

 total:
Number(document.getElementById("productPrice").innerHTML) *
Number(document.getElementById("quantity").value),

size:document.getElementById("size").value,

color:document.getElementById("color").value,

quantity:document.getElementById("quantity").value,

delivery:document.querySelector('input[name="delivery"]:checked').value,

 shipping: document.querySelector('input[name="delivery"]:checked').value === "Shipping" ? 6.99 : 0,
 
address:document.getElementById("address").value,

city:document.getElementById("city").value,

state:document.getElementById("state").value,

zip:document.getElementById("zip").value,

notes:document.getElementById("notes").value

});

localStorage.setItem("cart",JSON.stringify(cart));

location.href="cart.html";

}

/*=========================================
        BUY NOW
=========================================*/

function buyNow(){

const cart=JSON.parse(localStorage.getItem("cart")) || [];

cart.push({

id:product.id,

name:product.name,

image:product.image,

price:document.getElementById("productPrice").innerHTML,

size:document.getElementById("size").value,

color:document.getElementById("color").value,

quantity:document.getElementById("quantity").value,

delivery:document.querySelector('input[name="delivery"]:checked').value

});

localStorage.setItem("cart",JSON.stringify(cart));

location.href="checkout.html";

}

updateCartBadge();

updateFavoriteIcons();

 function openFullImage(img){

    img.classList.toggle("full-image");

}
 
</script>

</body>

</html>
