<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

<div class="logo">

<a href="../index.html">

<img src="../images/IMG_FSLOGO.PNG" alt="Forever Solid Logo">

</a>

</div>

<nav>

<ul>

<li><a href="../index.html">Home</a></li>

<li><a href="shop.html" class="active">Forever Solid</a></li>

<li><a href="greenbox.html">Green Box Baby</a></li>

<li><a href="../cart.html">Cart</a></li>

</ul>

</nav>

<div class="nav-icons">

<button onclick="location.href='../cart.html'">

🛒

<span id="cart-count">0</span>

</button>

</div>

<div class="menu-toggle">

☰

</div>

</header>

<div class="mobile-menu">

<a href="../index.html">Home</a>

<a href="shop.html">Forever Solid</a>

<a href="greenbox.html">Green Box Baby</a>

<a href="../cart.html">Cart</a>

</div>

<!-- ================= FEATURED ================= -->

<section class="shop-header">

<h1>

Forever Solid

</h1>

<p>

Premium Streetwear.
Built Different.

</p>

</section>

<!-- ================= SEARCH ================= -->

<section class="search-section">

<input

type="text"

id="searchBox"

placeholder="🔍 Search Forever Solid..."

onkeyup="searchProducts()">

</section>

<!-- ================= FILTER BUTTONS ================= -->

<section class="filter-section">

<button onclick="filterProducts('All')">

All

</button>

<button onclick="filterProducts('Shirts')">

Shirts

</button>

<button onclick="filterProducts('Long Sleeve')">

Long Sleeve

</button>

<button onclick="filterProducts('Hoodies')">

Hoodies

</button>

<button onclick="filterProducts('Shorts')">

Shorts

</button>

<button onclick="filterProducts('Short Sets')">

Sets

</button>

<button onclick="filterProducts('Hats')">

Hats

</button>

</section>



<!-- ================= PRODUCTS ================= -->

<section
id="shopProducts"
class="products-grid">

<!-- Products Load Here -->

</section>
<!-- ================= FOOTER ================= -->

<footer>

<div class="footer-logo">

<img src="../images/IMG_FSLOGO.PNG" alt="Forever Solid Logo">

</div>

<h2 class="footer-brand">

Forever Solid

</h2>

<p class="footer-tagline">

Built Different • Stay Solid

</p>

<div class="copyright">

© 2026 Forever Solid. All Rights Reserved.

</div>

</footer>

<script src="../products.js"></script>

<script src="../script.js"></script>

<script>

/*=========================================
        LOAD FOREVER SOLID PRODUCTS
=========================================*/

const container = document.getElementById("shopProducts");

let html = "";

products
.filter(product => product.brand === "Forever Solid")
.forEach(product => {

html += `

<div class="product-card" data-category="${product.category}">

    <button
        class="favorite-btn"
        data-id="${product.id}"
        onclick="toggleFavorite('${product.id}')">

        🤍

    </button>

    <img
        src="../${product.image}"
        alt="${product.name}">

    <div class="product-info">

        <h3>${product.name}</h3>

        <p>${product.category}</p>

      <div class="price">

    <strong>S–XL:</strong> $${product.priceSmall}
    <br>
    <strong>2XL+:</strong> $${product.priceLarge}

</div>  

        <button
            class="buy-btn"
            onclick="viewProduct('${product.id}')">

            Customize & Order

        </button>

    </div>

</div>

`;

});

container.innerHTML = html;

updateFavoriteIcons();
updateCartBadge();

        </script>

</body>

</html>
