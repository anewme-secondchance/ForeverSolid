<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page Not Found | Forever Solid</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.container{
    width:90%;
    max-width:600px;
}

.logo{
    width:300px;
    max-width:90%;
    margin-bottom:30px;
}

h1{
    font-size:48px;
    color:#b30000;
    margin-bottom:15px;
}

p{
    font-size:20px;
    line-height:1.6;
    margin-bottom:30px;
}

button{
    background:#b30000;
    color:#fff;
    border:none;
    padding:15px 35px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 15px rgba(179,0,0,.6);
}

button:hover{
    background:#d40000;
}

</style>

</head>

<body>

<div class="container">

<img src="images/IMG_FSLOGO.PNG" class="logo" alt="Forever Solid Logo">

<h1>404</h1>

<p>
Sorry, the page you're looking for doesn't exist.
</p>

<button onclick="window.location.href='index.html'">

Return Home

</button>

</div>

</body>
</html>
